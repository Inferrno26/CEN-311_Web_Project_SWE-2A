<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Pet | Pet Adoption Center</title>

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/addpet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>

  <header class="topbar">
    <div class="logo">
      <h1>Pet Adoption Center</h1>
    </div>
    <nav class="navbar">
      <ul class="nav-list">
        <li><a href="../index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="pets.html" class="active"><i class="fa-solid fa-paw"></i> Pets</a></li>
        <li><a href="adopters.html"><i class="fa-solid fa-user"></i> Adopters</a></li>
        <li><a href="applications.html"><i class="fa-regular fa-file"></i> Applications</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">

    <section class="page-header">
      <div class="header-text">
        <a href="pets.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Pets</a>
        <h2>Add New Pet</h2>
        <p>Fill in the information to add a new pet to the adoption center</p>
      </div>
    </section>

    <section class="content-section">
      <div id="form-message" class="form-message"></div>
      <form id="addPetForm" class="form-container">

        <div class="form-row">
          <div class="form-field">
            <label for="name">Pet Name</label>
            <input type="text" id="name" name="name" placeholder="Enter pet name" />
          </div>
          <div class="form-field">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter pet age in years" min="0" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="weight">Weight</label>
            <input type="number" id="weight" name="weight" placeholder="e.g. 11.5 kg" min="0" step="0.1" />
          </div>
          <div class="form-field">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="City, State" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="">Select gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
          <div class="form-field">
            <label for="pet-type">Type</label>
            <select id="pet-type" name="pet-type">
              <option value="">Select type</option>
              <option value="Dog">Dog</option>
              <option value="Cat">Cat</option>
              <option value="Rabbit">Rabbit</option>
            </select>
          </div>
          <div class="form-field">
            <label for="pet-status">Status</label>
            <select id="pet-status" name="pet-status">
              <option value="">Select status</option>
              <option value="Available">Available</option>
              <option value="Pending">Pending</option>
              <option value="Adopted">Adopted</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Describe the pet's personality, behaviour, and any special needs"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button class="primary-btn" type="submit">Add Pet</button>
        </div>

      </form>
    </section>

  </main>

  <script src="../js/shared.js"></script>
</body>
</html>
