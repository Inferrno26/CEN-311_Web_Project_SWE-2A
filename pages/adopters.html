<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adopters - Pet Adoption Center</title>
  <link rel="stylesheet" href="../css/adopters.css" />
</head>
<body>
  
  <nav class="navbar">
  <div class="logo">♡ Pet Adoption Center</div>

  <ul class="nav-links">
    <li>
      <a href="../index.html">
        <i class="fa-solid fa-house"></i> Home
      </a>
    </li>

    <li>
      <a href="pets.html">
        <i class="fa-solid fa-paw"></i> Pets
      </a>
    </li>

    <li>
      <a href="adopters.html" class="active">
        <i class="fa-regular fa-user"></i> Adopters
      </a>
    </li>

    <li>
      <a href="applications.html">
        <i class="fa-regular fa-file"></i> Applications
      </a>
    </li>
  </ul>
</nav>

  <main class="page">
    <h1>Adopters</h1>
    <p class="subtitle">Manage adopter information and records.</p>

    <div class="top-bar">
      <button id="showFormBtn">Add Adopter</button>
      <input type="text" id="searchInput" placeholder="Search adopters..." />
    </div>

    <div class="content-card">
      <h2>Adopters Content Area</h2>

      <div class="form-box" id="formBox">
        <h3 id="formTitle">Add New Adopter</h3>

        <div class="form-grid">
          <input type="text" id="name" placeholder="Full Name" />
          <input type="text" id="phone" placeholder="Phone Number" />
          <input type="email" id="email" placeholder="Email Address" />
          <input type="text" id="address" placeholder="Address" />
        </div>

        <div class="form-actions">
          <button id="saveBtn">Save</button>
          <button id="cancelBtn" type="button">Cancel</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adoptersTableBody">
            <tr>
              <td colspan="5" class="empty-row">No adopters added yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer class="footer">© 2026 Pet Adoption Center Management System</footer>
  </main>

  <script src="adopters.js"></script>
</body>
</html>
