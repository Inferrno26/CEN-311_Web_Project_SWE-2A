<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pets | Pet Adoption Center</title>

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/pets.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>

  <header class="topbar">
    <div class="logo">
      <h1>Pet Adoption Center</h1>
    </div>
    <nav class="navbar">
      <ul class="nav-list">
        <li><a href="../index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="pets.html" class="active"><i class="fa-solid fa-paw"></i> Pets</a></li>
        <li><a href="adopters.html"><i class="fa-solid fa-user"></i> Adopters</a></li>
        <li><a href="applications.html"><i class="fa-regular fa-file"></i> Applications</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">

    <section class="page-header">
      <div class="header-text">
        <h2>Available Pets</h2>
        <p>Find your perfect companion!</p>
      </div>
      <a class="primary-btn" href="addpet.html">Add Pet</a>
    </section>

    <div class="top-menu">
      <div class="filters">

        <div class="filter-type">
          <label for="filter-type">Filter by Type</label>
          <select id="filter-type">
            <option>All</option>
            <option>Dog</option>
            <option>Cat</option>
            <option>Rabbit</option>
          </select>
        </div>

        <div class="filter-status">
          <label for="filter-status">Filter by Status</label>
          <select id="filter-status">
            <option>All</option>
            <option>Available</option>
            <option>Pending</option>
            <option>Adopted</option>
          </select>
        </div>

      </div>

      <div class="toolbar">
        <label for="filter-search">Search</label>
        <input type="text" id="filter-search" placeholder="Search pets..." class="search-input" />
      </div>
    </div>

    <section class="content-section">
      <div class="card-container"></div>
    </section>

  </main>

  <script src="../js/shared.js"></script>
</body>
</html>
