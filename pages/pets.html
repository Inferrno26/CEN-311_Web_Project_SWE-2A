<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pets | Pet Adoption Center</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/pets.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">
      <h1>Pet Adoption Center</h1>
    </div>
   
    <nav class="navbar">
      <ul class="nav-list">
        <li><a href="../index.html">Home</a></li>
        <li><a href="pets.html" class="active">Pets</a></li>
        <li><a href="adopters.html">Adopters</a></li>
        <li><a href="applications.html">Applications</a></li>
      </ul>
    </nav>

  </header>

  <main class="container">
  
    <section class="page-header">
      <div class = "header-text">
        <h2>Available pets</h2>
        <p>Find your perfect companion!</p>
      </div>
      <a class="primary-btn" href="addpet.html">Add Pet</a>
    </section>

    <div class="top-menu">
      <div class="filters">
        <div class="filter-type">
          <label id="type-label" for="type">Filter by Type</label>
          <select id="type">
            <option>All</option>
            <option>Dog</option>
            <option>Cat</option>
            <option>Rabbit</option>
          </select>
        </div>

        <div class="filter-status">
          <label id="status-label" for="status">Filter by Status</label>
          <select id="status">
            <option>All</option>
            <option>Available</option>
            <option>Pending</option>
            <option>Adopted</option>
          </select>
        </div>
      </div>

      <section class="toolbar">
        <label id="search-label" for="search">Search</label>
        <input type="text" placeholder="Search pets..." class="search-input" />
      </section>
    </div>

    <section class="content-section">
      <div class="card-container"></div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Pet Adoption Center Management System</p>
  </footer>

  <script src="../js/shared.js"></script>
</body>
</html>
