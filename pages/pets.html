<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pets | Pet Adoption Center</title>

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/pets.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>

  <header class="topbar">
    <div class="logo">
      <h1>Pet Adoption Center</h1>
    </div>
    <nav class="navbar">
      <ul class="nav-list">
        <li><a href="../index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="pets.html" class="active"><i class="fa-solid fa-paw"></i> Pets</a></li>
        <li><a href="adopters.html"><i class="fa-solid fa-user"></i> Adopters</a></li>
        <li><a href="applications.html"><i class="fa-regular fa-file"></i> Applications</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">

    <section class="page-header">
      <div class="header-text">
        <h2>Available Pets</h2>
        <p>Find your perfect companion!</p>
      </div>
      <a class="primary-btn" href="addpet.html">Add Pet</a>
    </section>

    <div class="top-menu">
      <div class="filters">

        <div class="filter-type">
          <label for="filter-type">Filter by Type</label>
          <select id="filter-type">
            <option>All</option>
            <option>Dog</option>
            <option>Cat</option>
            <option>Rabbit</option>
          </select>
        </div>

        <div class="filter-status">
          <label for="filter-status">Filter by Status</label>
          <select id="filter-status">
            <option>All</option>
            <option>Available</option>
            <option>Pending</option>
            <option>Adopted</option>
          </select>
        </div>

      </div>

      <div class="toolbar">
        <label for="filter-search">Search</label>
        <input type="text" id="filter-search" placeholder="Search pets..." class="search-input" />
      </div>
    </div>

    <section class="content-section">
      <div class="card-container"></div>
    </section>

  </main>

  <div id="editPetOverlay" class="pet-modal-overlay">
    <div class="pet-modal">
      <div class="pet-modal-header">
        <h3>Edit Pet</h3>
        <button class="pet-modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <div class="pet-modal-body">
        <input type="hidden" id="edit-pet-id" />

        <div class="pet-form-row">
          <div class="pet-form-field">
            <label for="edit-name">Pet Name</label>
            <input type="text" id="edit-name" placeholder="Enter pet name" />
          </div>
          <div class="pet-form-field">
            <label for="edit-age">Age</label>
            <input type="number" id="edit-age" placeholder="Years" min="0" />
          </div>
        </div>

        <div class="pet-form-row">
          <div class="pet-form-field">
            <label for="edit-weight">Weight (kg)</label>
            <input type="number" id="edit-weight" placeholder="e.g. 11.5" min="0" step="0.1" />
          </div>
          <div class="pet-form-field">
            <label for="edit-location">Location</label>
            <input type="text" id="edit-location" placeholder="City, State" />
          </div>
        </div>

        <div class="pet-form-row">
          <div class="pet-form-field">
            <label for="edit-gender">Gender</label>
            <select id="edit-gender">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div class="pet-form-field">
            <label for="edit-type">Type</label>
            <select id="edit-type">
              <option value="Dog">Dog</option>
              <option value="Cat">Cat</option>
              <option value="Rabbit">Rabbit</option>
            </select>
          </div>
          <div class="pet-form-field">
            <label for="edit-status">Status</label>
            <select id="edit-status">
              <option value="Available">Available</option>
              <option value="Pending">Pending</option>
              <option value="Adopted">Adopted</option>
            </select>
          </div>
        </div>

        <div class="pet-form-row">
          <div class="pet-form-field">
            <label for="edit-description">Description</label>
            <textarea id="edit-description" rows="3"></textarea>
          </div>
        </div>
      </div>
      <div class="pet-modal-footer">
        <button class="pet-cancel-btn" onclick="closeEditModal()">Cancel</button>
        <button class="primary-btn" onclick="saveEditModal()">Save</button>
      </div>
    </div>
  </div>

  <script src="../js/shared.js"></script>
</body>
</html>
